[project]
name = "sasi-mcp"
version = "0.1.0"
description = "SASI FAQ corpus + MCP server. Reads summermed@stanford.edu via Outlook AppleScript, redacts PII locally, exposes search to Claude."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Full pipeline runtime — Presidio for PII, sentence-transformers for embeddings,
# the official MCP SDK for the server, spaCy for temporal-anchor NER. None of
# these are needed to run the unit tests, which exercise pure-Python logic only.
full = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "sentence-transformers>=2.7",
  "mcp>=1.0",
  "spacy>=3.7",
  "scikit-learn>=1.3",
  "hdbscan>=0.8",
  "numpy>=1.26",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "ruff>=0.4",
  "types-pyyaml",
]

[project.scripts]
sasi-mcp = "sasi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sasi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
